---
# 1. The NFS Server Pod deployed to a normal Linux node.
#    Serves the CephFS PVC over NFS v3 using go-nfs-server.
apiVersion: v1
kind: Pod
metadata:
  name: macos-nfs-server
  namespace: default
  labels:
    app.kubernetes.io/name: macos-nfs-server
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
  containers:
    - name: nfs-server
      image: your-registry/go-nfs-server:v1  # Build from example/go-sidecar/
      env:
        - name: SHARED_DIRECTORY
          value: /data/shared
      ports:
        - name: nfs
          containerPort: 2049
      volumeMounts:
        - name: nfs-export
          mountPath: /data/shared
  volumes:
    - name: nfs-export
      persistentVolumeClaim:
        claimName: my-cephfs-pvc  # Replace with your PVC name

---
# 2. The Service to expose the NFS Pod
apiVersion: v1
kind: Service
metadata:
  name: macos-nfs-service
  namespace: default
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: macos-nfs-server
  ports:
    - port: 2049
      targetPort: 2049
      # nodePort: 32000  # Uncomment to pin a specific port

---
# 3. The macOS Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: macos-exec-nfs-job
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        macos-exec-kubelet/nfs-service: "macos-nfs-service"
        macos-exec-kubelet/nfs-mount-path: "/data/shared"
    spec:
      restartPolicy: Never
      containers:
      - name: macos
        image: placeholder  # Ignored — no image is pulled
        command:
          - "/bin/zsh"
          - "-c"
          - |
            NFS_DIR="/private/tmp/default"

            echo "=== NFS Mount Test ==="

            # 1. Check mount exists
            echo "1. Checking mount..."
            if mount | grep -q "$NFS_DIR"; then
              echo "   PASS: NFS is mounted at $NFS_DIR"
            else
              echo "   FAIL: No NFS mount found at $NFS_DIR"
              exit 1
            fi

            # 2. List directory contents
            echo "2. Listing $NFS_DIR..."
            ls -la "$NFS_DIR"

            # 3. Write a test file
            TEST_FILE="$NFS_DIR/mac_test_$(date +%s).txt"
            echo "3. Writing test file $TEST_FILE..."
            echo "Hello from macOS at $(date)" > "$TEST_FILE"

            # 4. Read it back
            echo "4. Reading back..."
            cat "$TEST_FILE"

            # 5. Cleanup
            rm -f "$TEST_FILE"
            echo "=== All NFS tests PASSED ==="
      tolerations:
      - key: "virtual-kubelet.io/provider"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: "darwin"
