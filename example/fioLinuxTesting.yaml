# Not a macOS workload! Just for testing linux fio performance
apiVersion: batch/v1
kind: Job
metadata:
  name: linux-fio-benchmark
  namespace: example-namespace
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: macos-robot-secret
      containers:
      - name: linux-fio
        image: <your-registry>/linux-vs-macos:v1
        command:
          - "/bin/bash"
          - "-c"
          - |
            TARGET_DIR="/proj/example-namespace"
            RESULTS_FILE="$TARGET_DIR/fio_native_ceph_results_$(date +%Y-%m-%d-%H-%M).txt"
            
            echo "=== FIO Native Ceph Storage Benchmark ===" | tee -a "$RESULTS_FILE"
            cd "$TARGET_DIR"
            
            # (Optional) Verify FIO is installed
            if ! command -v fio &> /dev/null; then
              echo "Error: fio is not installed in this Linux container." | tee -a "$RESULTS_FILE"
              exit 1
            fi
            
            echo "--- 1. Sequential Write Test (Simulating Checkpoint Save) ---" | tee -a "$RESULTS_FILE"
            fio --name=seqwrite --ioengine=libaio --rw=write --bs=1M --size=2G --numjobs=1 --iodepth=16 --directory="$TARGET_DIR" | tee -a "$RESULTS_FILE"
            
            echo "--- 2. Sequential Read Test (Simulating Model Load) ---" | tee -a "$RESULTS_FILE"
            fio --name=seqread --ioengine=libaio --rw=read --bs=1M --size=2G --numjobs=1 --iodepth=16 --directory="$TARGET_DIR" | tee -a "$RESULTS_FILE"
            
            echo "--- 3. Random Read Test (Simulating Dataset Dataloader) ---" | tee -a "$RESULTS_FILE"
            fio --name=randread --ioengine=libaio --rw=randread --bs=4k --size=1G --numjobs=4 --iodepth=32 --directory="$TARGET_DIR" | tee -a "$RESULTS_FILE"
            
            # Cleanup the temporary workload files generated by fio
            rm -f "$TARGET_DIR"/seqwrite* "$TARGET_DIR"/seqread* "$TARGET_DIR"/randread*
            
            echo "=== FIO Benchmark Completed ===" | tee -a "$RESULTS_FILE"
            echo "All results saved to: $RESULTS_FILE"

        resources:
          requests:
            cpu: "4"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        volumeMounts:
        - name: project-storage
          mountPath: /proj/example-namespace
      volumes:
      - name: project-storage
        persistentVolumeClaim:
          claimName: csi-cephfs-example-namespace