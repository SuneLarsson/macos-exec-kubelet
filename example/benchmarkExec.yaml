---
# 1. The NFS Server Pod deployed to a normal Linux node.
apiVersion: v1
kind: Pod
metadata:
  name: macos-nfs-server
  namespace: example-namespace
  labels:
    app.kubernetes.io/name: macos-nfs-server
spec:
  imagePullSecrets:
  - name: macos-robot-secret
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
  containers:
    - name: nfs-server
      image: <your-registry>/go-nfs-server:v1
      env:
        - name: SHARED_DIRECTORY
          value: /proj/example-namespace
      ports:
        - name: nfs
          containerPort: 2049
      volumeMounts:
        - name: nfs-export
          mountPath: /proj/example-namespace
  volumes:
    - name: nfs-export
      persistentVolumeClaim:
        claimName: csi-cephfs-example-namespace

---
# 2. The Service to expose the NFS Pod
apiVersion: v1
kind: Service
metadata:
  name: macos-nfs-service
  namespace: example-namespace
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: macos-nfs-server
  ports:
    - port: 2049
      targetPort: 2049
      nodePort: 32000

---
# 3. The Mac OS Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: macos-exec-benchmark
  namespace: example-namespace
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        macos-exec-kubelet/nfs-service: "macos-nfs-service"
        macos-exec-kubelet/nfs-mount-path: "/proj/example-namespace"
    spec:
      restartPolicy: Never
      containers:
      - name: macos-exec-bench
        image: placeholder
        command:
          - "/bin/zsh"
          - "-c"
          - |
            NFS_DIR="/private/tmp/example-namespace"
            SCRIPT_DIR="$NFS_DIR/benchmarks"

            OUTPUT_DIR="$NFS_DIR/results_exec"
            bash "$SCRIPT_DIR/run_ai_suite.sh" --runs 5 --seed 8 --test "llm" --tokens 20480 --output-dir "$OUTPUT_DIR"
      tolerations:
      - key: "virtual-kubelet.io/provider"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: "darwin"
