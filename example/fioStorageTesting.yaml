---
# 1. The NFS Server Pod deployed to a normal Linux node.
apiVersion: v1
kind: Pod
metadata:
  name: macos-nfs-server
  namespace: example-namespace
  labels:
    app.kubernetes.io/name: macos-nfs-server
spec:
  imagePullSecrets:
  - name: macos-robot-secret
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
  containers:
    - name: nfs-server
      image: <your-registry>/go-nfs-server:v1
      env:
        - name: SHARED_DIRECTORY
          value: /proj/example-namespace
      ports:
        - name: nfs
          containerPort: 2049
      volumeMounts:
        - name: nfs-export
          mountPath: /proj/example-namespace
      resources:
        requests:
          cpu: "4"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
  volumes:
    - name: nfs-export
      persistentVolumeClaim:
        claimName: csi-cephfs-example-namespace

---
# 2. The Service to expose the NFS Pod
apiVersion: v1
kind: Service
metadata:
  name: macos-nfs-service
  namespace: example-namespace
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: macos-nfs-server
  ports:
    - port: 2049
      targetPort: 2049
      nodePort: 32000

---
# 3. The Mac OS Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: macos-fio-benchmark
  namespace: example-namespace
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        macos-exec-kubelet/nfs-service: "macos-nfs-service"
        macos-exec-kubelet/nfs-mount-path: "/proj/example-namespace"
    spec:
      restartPolicy: Never
      containers:
      - name: macos-fio
        image: placeholder
        command:
          - "/bin/zsh"
          - "-c"
          - |
            NFS_DIR="/private/tmp/example-namespace"
            RESULTS_FILE="$NFS_DIR/fio_benchmark_results_$(date +%Y-%m-%d-%H-%M).txt"
            
            echo "=== FIO NFS Storage Benchmark ===" | tee -a "$RESULTS_FILE"
            cd "$NFS_DIR"
            
            if ! command -v fio &> /dev/null; then
              echo "Error: fio is not installed on this macOS runner." | tee -a "$RESULTS_FILE"
              echo "Please install it via HOMEBREW: brew install fio" | tee -a "$RESULTS_FILE"
              exit 1
            fi
            
            echo "--- 1. Sequential Write Test (Simulating Checkpoint Save) ---" | tee -a "$RESULTS_FILE"
            fio --name=seqwrite --ioengine=posixaio --direct=1 --rw=write --bs=1M --size=20G --numjobs=1 --iodepth=16 --directory="$NFS_DIR" | tee -a "$RESULTS_FILE"
            
            echo "--- 2. Sequential Read Test (Simulating Model Load) ---" | tee -a "$RESULTS_FILE"
            fio --name=seqread --ioengine=posixaio --direct=1 --rw=read --bs=1M --size=20G --numjobs=1 --iodepth=16 --directory="$NFS_DIR" | tee -a "$RESULTS_FILE"
            
            echo "--- 3. Random Read Test (Simulating Dataset Datalaoder) ---" | tee -a "$RESULTS_FILE"
            fio --name=randread --ioengine=posixaio --direct=1 --rw=randread --bs=4k --size=1G --numjobs=4 --iodepth=32 --directory="$NFS_DIR" | tee -a "$RESULTS_FILE"
            
            # Cleanup the temporary workload files generated by fio, but KEEP the results text file!
            rm -f "$NFS_DIR"/seqwrite* "$NFS_DIR"/seqread* "$NFS_DIR"/randread*
            
            echo "=== FIO Benchmark Completed ===" | tee -a "$RESULTS_FILE"
            echo "All results saved to: $RESULTS_FILE"
      tolerations:
      - key: "virtual-kubelet.io/provider"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: "darwin"